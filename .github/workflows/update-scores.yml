name: Update World Cup Scores

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch scores and update via GitHub API
        env:
          API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.error
          import json
          import os
          import base64
          from datetime import datetime, timezone

          api_key      = os.environ["API_KEY"]
          github_token = os.environ["GITHUB_TOKEN"]
          repo         = os.environ["REPO"]

          # ── 1. שלוף תוצאות מ-API-Football ──
          print(f"API key: {api_key[:6]}...")

          urls_to_try = [
              ("v3.football.api-sports.io", "https://v3.football.api-sports.io/fixtures?league=1&season=2026", "x-apisports-key"),
              ("v3.api-football.com",       "https://v3.api-football.com/fixtures?league=1&season=2026",       "x-rapidapi-key"),
          ]

          fixtures = []
          for name, url, hkey in urls_to_try:
              print(f"Trying {name}...")
              req = urllib.request.Request(url, headers={hkey: api_key})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = json.loads(r.read().decode())
                  errors = data.get("errors", {})
                  print(f"  errors: {errors}  count: {len(data.get('response',[]))}")
                  if not errors or errors in ([], {}):
                      fixtures = data.get("response", [])
                      print(f"  OK - {len(fixtures)} fixtures")
                      break
              except Exception as e:
                  print(f"  Failed: {e}")

          statuses = set(f.get("fixture",{}).get("status",{}).get("short","?") for f in fixtures)
          print(f"Statuses: {statuses}")

          matches = []
          for f in fixtures:
              fix   = f.get("fixture", {})
              teams = f.get("teams", {})
              goals = f.get("goals", {})
              score = f.get("score", {})
              st    = fix.get("status", {}).get("short", "")
              if st in ("NS", "TBD"):
                  continue
              hg = goals.get("home")
              ag = goals.get("away")
              if hg is None or ag is None:
                  continue
              entry = {
                  "home":   teams.get("home",{}).get("name",""),
                  "away":   teams.get("away",{}).get("name",""),
                  "score":  f"{hg}-{ag}",
                  "status": "live" if st in ("1H","2H","ET","BT","P","INT","LIVE") else "final",
                  "minute": fix.get("status",{}).get("elapsed"),
                  "date":   fix.get("date","")[:10],
              }
              pen = score.get("penalty", {})
              if pen.get("home") is not None:
                  entry["penalty"] = f"{pen['home']}-{pen['away']}"
              matches.append(entry)
              print(f"  + {entry['home']} {entry['score']} {entry['away']}")

          output = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "count":   len(matches),
              "matches": matches,
          }
          content_str = json.dumps(output, ensure_ascii=False, indent=2)

          # ── 2. עדכן scores.json דרך GitHub API (עוקף git לגמרי) ──
          gh_api = f"https://api.github.com/repos/{repo}/contents/scores.json"
          headers = {
              "Authorization": f"token {github_token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          }

          # קבל את ה-SHA הנוכחי של הקובץ
          req = urllib.request.Request(gh_api, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  current = json.loads(r.read().decode())
              sha = current["sha"]
              print(f"Current scores.json SHA: {sha[:8]}")
          except Exception as e:
              sha = None
              print(f"No existing file (will create): {e}")

          # שלח את התוכן החדש
          payload = {
              "message": f"🤖 Update scores {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
              "content": base64.b64encode(content_str.encode()).decode(),
          }
          if sha:
              payload["sha"] = sha

          req = urllib.request.Request(
              gh_api,
              data=json.dumps(payload).encode(),
              headers=headers,
              method="PUT",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  result = json.loads(r.read().decode())
              print(f"✅ scores.json updated! commit: {result['commit']['sha'][:8]}")
              print(f"   Written {len(matches)} results")
          except urllib.error.HTTPError as e:
              print(f"❌ GitHub API error: {e.code} {e.read().decode()}")
              exit(1)
          EOF
