name: Update World Cup Scores

on:
  schedule:
    - cron: '0 19 * * *'   # 22:00 שעון ישראל — לפני משחקי הלילה
    - cron: '0 20 * * *'   # 23:00 שעון ישראל — לפני משחקי הלילה
    - cron: '0 22 * * *'   # 01:00 שעון ישראל — אמצע הלילה
    - cron: '0 23 * * *'   # 02:00 שעון ישראל — לפני משחקי הלילה
    - cron: '0 1 * * *'    # 04:00 שעון ישראל — אחרי סיום כל המשחקים
    - cron: '0 7 * * *'    # 10:00 שעון ישראל — סיכום בוקר
  workflow_dispatch:

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch scores and update via GitHub API
        env:
          API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.error
          import json
          import os
          import base64
          from datetime import datetime, timezone

          api_key      = os.environ["API_KEY"]
          github_token = os.environ["GITHUB_TOKEN"]
          repo         = os.environ["REPO"]

          print(f"API key: {api_key[:6]}...")

          # football-data.org — World Cup 2026 = competition WC, season 2026
          url = "https://api.football-data.org/v4/competitions/WC/matches?season=2026"
          req = urllib.request.Request(url, headers={"X-Auth-Token": api_key})

          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  data = json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"HTTP {e.code}: {body}")
              exit(1)
          except Exception as e:
              print(f"Request failed: {e}")
              exit(1)

          all_matches = data.get("matches", [])
          print(f"Total matches from API: {len(all_matches)}")

          # סטטוסים: SCHEDULED, TIMED, IN_PLAY, PAUSED, FINISHED, SUSPENDED, POSTPONED, CANCELLED
          statuses = set(m.get("status","") for m in all_matches)
          print(f"Statuses found: {statuses}")

          matches = []
          for m in all_matches:
              status = m.get("status", "")
              if status in ("SCHEDULED", "TIMED", "POSTPONED", "CANCELLED", "SUSPENDED"):
                  continue

              home = m.get("homeTeam", {}).get("name", "")
              away = m.get("awayTeam", {}).get("name", "")
              score_data = m.get("score", {})
              is_live = status in ("IN_PLAY", "PAUSED")

              # נסה fullTime קודם, אחר כך regularTime, אחר כך halfTime
              ft  = score_data.get("fullTime", {})
              rt  = score_data.get("regularTime", {})
              ht  = score_data.get("halfTime", {})

              hg = ft.get("home")
              ag = ft.get("away")
              if hg is None: hg = rt.get("home")
              if ag is None: ag = rt.get("away")
              if hg is None: hg = ht.get("home")
              if ag is None: ag = ht.get("away")

              # משחק חי שעדיין לא התחיל לדווח ניקוד — נציג 0-0
              if is_live and hg is None: hg = 0
              if is_live and ag is None: ag = 0

              if hg is None or ag is None:
                  continue

              is_live = status in ("IN_PLAY", "PAUSED")

              entry = {
                  "home":   home,
                  "away":   away,
                  "score":  f"{hg}-{ag}",
                  "status": "live" if is_live else "final",
                  "minute": m.get("minute"),
                  "date":   (m.get("utcDate",""))[:10],
              }

              # פנדלים
              pen = score_data.get("penalties", {})
              if pen and pen.get("home") is not None:
                  entry["penalty"] = f"{pen['home']}-{pen['away']}"

              matches.append(entry)
              print(f"  + {home} {hg}-{ag} {away} [{status}]")

          output = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "count":   len(matches),
              "matches": matches,
          }
          content_str = json.dumps(output, ensure_ascii=False, indent=2)
          print(f"\nTotal results to write: {len(matches)}")

          # ── עדכן scores.json דרך GitHub API ──
          gh_api  = f"https://api.github.com/repos/{repo}/contents/scores.json"
          headers = {
              "Authorization": f"token {github_token}",
              "Accept":        "application/vnd.github+json",
              "Content-Type":  "application/json",
          }

          # קבל SHA נוכחי
          req = urllib.request.Request(gh_api, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  current = json.loads(r.read().decode())
              sha = current["sha"]
              print(f"Current SHA: {sha[:8]}")
          except Exception as e:
              sha = None
              print(f"No existing file: {e}")

          payload = {
              "message": f"🤖 Update scores {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
              "content": base64.b64encode(content_str.encode()).decode(),
          }
          if sha:
              payload["sha"] = sha

          req = urllib.request.Request(
              gh_api,
              data=json.dumps(payload).encode(),
              headers=headers,
              method="PUT",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  result = json.loads(r.read().decode())
              print(f"✅ scores.json updated! commit: {result['commit']['sha'][:8]}")
          except urllib.error.HTTPError as e:
              print(f"❌ GitHub API error: {e.code} {e.read().decode()}")
              exit(1)
          EOF
